<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exo 06 - Synthèse : carte de visite</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="card">
      <h1 class="card__name">Marie Dupont</h1>
      <p class="card__job">
        Designer
        <span class="card__separator">·</span>
        <span class="card__email">marie@example.com</span>
      </p>
      <div class="card__actions">
        <a class="card__btn card__btn--primary" href="#">Contacter</a>
        <a class="card__btn card__btn--secondary" href="#">Portfolio</a>
      </div>
      <span class="card__badge">New</span>
    </article>
  </body>
</html>
